<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview — Hot Express Admin</title>
<link rel="icon" href="../assets/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">

</head>
<body>
<div class="mobile-topbar">
  <button id="menuToggle" class="btn btn-outline btn-sm">☰</button>
  <a href="../index.html" class="brand" style="font-size:15px"><img src="../assets/images/logo.png" style="height:22px"> Hot Express</a>
  <span></span>
</div>
<div class="shell">
  <aside class="sidebar">
    <a href="../index.html" class="brand"><img src="../assets/images/logo.png" alt="Hot Express"> Hot Express</a>
    <nav class="side-nav">
      <div class="section-label">Admin</div>
      <a href="dashboard.html" class="active"><span class="ic">📊</span> Overview</a>
      <a href="users.html"><span class="ic">👥</span> Users</a>
      <a href="vendors.html"><span class="ic">🏪</span> Vendors</a>
      <a href="riders.html"><span class="ic">🏍</span> Riders</a>
      <a href="deliveries.html"><span class="ic">📦</span> Deliveries</a>
      <a href="payments.html"><span class="ic">💰</span> Payments</a>
      <a href="disputes.html"><span class="ic">⚠️</span> Disputes</a>
      <a href="settings.html"><span class="ic">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Overview</h1><div class="sub">Hot Express · Ondo &amp; Enugu</div></div>
      <div class="avatar" data-user-avatar>—</div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num" id="statUsers">0</div><div class="label">Total users</div></div>
      <div class="stat-card"><div class="num" id="statVendors">0</div><div class="label">Vendors</div></div>
      <div class="stat-card"><div class="num" id="statRiders">0</div><div class="label">Riders</div></div>
      <div class="stat-card"><div class="num" id="statDeliveries">0</div><div class="label">Total requests</div></div>
      <div class="stat-card"><div class="num" id="statCommission">₦0</div><div class="label">Commission earned</div></div>
    </div>
    <p class="muted">By location: <span id="locBreakdown">—</span></p>
    <h3>Recent requests</h3>
    <div class="card">
      <table class="list-table">
        <thead><tr><th>Item</th><th>Location</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="recentList"></tbody>
      </table>
    </div>
  </main>
</div>
<script type="module">import { initAdminDashboard } from "../js/admin.js"; initAdminDashboard();</script>
</body>
</html>
