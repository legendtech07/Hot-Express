<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Hot Express</title>
<link rel="icon" href="../assets/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/user.css">
</head>
<body>
<div class="mobile-topbar">
  <button id="menuToggle" class="btn btn-outline btn-sm">☰</button>
  <a href="../index.html" class="brand" style="font-size:15px"><img src="../assets/images/logo.png" style="height:22px"> Hot Express</a>
  <span></span>
</div>
<div class="shell">
  <aside class="sidebar">
    <a href="../index.html" class="brand"><img src="../assets/images/logo.png" alt="Hot Express"> Hot Express</a>
    <nav class="side-nav">
      <div class="section-label">Buyer</div>
      <a href="dashboard.html" class="active"><span class="ic">🏠</span> Dashboard</a>
      <a href="deliveries.html"><span class="ic">📦</span> My deliveries</a>
      <a href="request-rider.html"><span class="ic">🛵</span> Request a rider</a>
      <a href="create-delivery.html"><span class="ic">✉️</span> Send a package</a>
      <a href="notifications.html"><span class="ic">🔔</span> Notifications</a>
      <a href="profile.html"><span class="ic">⚙️</span> Profile</a>
      <div class="section-label">More</div>
      <a href="../vendor/dashboard.html" id="vendorAreaLink" style="display:none"><span class="ic">🏪</span> Vendor area</a>
      <a href="../rider/dashboard.html" id="riderAreaLink" style="display:none"><span class="ic">🏍</span> Rider area</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Welcome back, <span data-user-name>—</span></h1>
        <div class="sub">Hot Express · <span data-user-location>—</span></div>
      </div>
      <div class="user-chip">
        <span class="role-pill">Buyer</span>
        <div class="avatar" data-user-avatar>—</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="num" id="statActive">0</div><div class="label">Active deliveries</div></div>
      <div class="stat-card"><div class="num" id="statDelivered">0</div><div class="label">Delivered</div></div>
    </div>

    <div class="flex-between" style="margin-bottom:14px">
      <h3 style="margin:0">Recent activity</h3>
      <a href="request-rider.html" class="btn btn-primary btn-sm">+ Request a rider</a>
    </div>
    <div id="recentList" style="margin-bottom:36px"></div>

    <div class="flex-between" style="margin-bottom:14px">
      <h3 style="margin:0">Marketplace near you</h3>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </main>
</div>

<script type="module">
  import { initUserDashboard } from "../js/user.js";
  initUserDashboard();
</script>
</body>
</html>
