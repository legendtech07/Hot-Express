<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a rider — Hot Express Vendor</title>
<link rel="icon" href="../assets/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/user.css">
<link rel="stylesheet" href="../css/vendor.css">

</head>
<body>
<div class="mobile-topbar">
  <button id="menuToggle" class="btn btn-outline btn-sm">☰</button>
  <a href="../index.html" class="brand" style="font-size:15px"><img src="../assets/images/logo.png" style="height:22px"> Hot Express</a>
  <span></span>
</div>
<div class="shell">
  <aside class="sidebar">
    <a href="../index.html" class="brand"><img src="../assets/images/logo.png" alt="Hot Express"> Hot Express</a>
    <nav class="side-nav">
      <div class="section-label">Vendor</div>
      <a href="dashboard.html"><span class="ic">🏪</span> Dashboard</a>
      <a href="deliveries.html"><span class="ic">📦</span> Fulfilments</a>
      <a href="create-delivery.html" class="active"><span class="ic">🛵</span> Request a rider</a>
      <a href="notifications.html"><span class="ic">🔔</span> Notifications</a>
      <a href="profile.html"><span class="ic">⚙️</span> Vendor profile</a>
      <div class="section-label">More</div>
      <a href="../user/dashboard.html"><span class="ic">🏠</span> Buyer area</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Request a rider</h1><div class="sub">For an order you're fulfilling directly.</div></div>
      <div class="avatar" data-user-avatar>—</div>
    </div>
    <div class="card" style="max-width:560px">
      <form id="requestForm" novalidate>
        <div class="field"><label for="itemDescription">What's being delivered?</label><input type="text" name="itemDescription" id="itemDescription" required></div>
        <div class="field"><label for="pickupAddress">Pickup from</label><input type="text" name="pickupAddress" id="pickupAddress" required placeholder="Your shop / store address"></div>
        <div class="field"><label for="dropoffAddress">Deliver to</label><input type="text" name="dropoffAddress" id="dropoffAddress" required></div>
        <div class="field"><label for="recipientName">Recipient's name</label><input type="text" name="recipientName" id="recipientName" required></div>
        <div class="field"><label for="recipientPhone">Recipient's phone</label><input type="tel" name="recipientPhone" id="recipientPhone" required></div>
        <div class="field"><label for="notes">Notes (optional)</label><textarea name="notes" id="notes"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Request a rider</button>
      </form>
    </div>
  </main>
</div>
<script type="module">import { initVendorCreateDelivery } from "../js/vendor.js"; initVendorCreateDelivery();</script>
</body>
</html>
